  description: Draft policy pages for the charity to approve.
  files:
  - name: privacy
    label: Privacy policy
    file: src/_data/text/privacy.json
    fields:
    - label: Page title and search description
      name: meta
      widget: object
      collapsed: true
      fields:
      - label: Page title (browser tab and search results)
        name: title
        widget: string
      - label: Short description (search results)
        name: description
        widget: text
    - label: 'Section 1: Privacy policy'
      name: s1
      widget: object
      collapsed: true
      fields:
      - label: 'Main heading: “Privacy policy”'
        name: h1
        widget: text
        hint: Words in ==double equals signs== show in colour. A new line starts a new line on the page.
      - label: 'Paragraph: “How Happy Paws Cat Rescue collects and…”'
        name: p
        widget: string
      - label: 'Paragraph 2: “Last updated: date”'
        name: p2
        widget: string
    - label: Pink "draft" notice at the top
      name: draft
      required: false
      widget: markdown
      buttons:
      - bold
      - italic
      - link
      editor_components: []
      modes:
      - rich_text
      hint: 'Leave this box empty to remove the notice. '
    - label: Sections of the page
      name: sections
      widget: list
      fields:
      - label: Section title
        name: title
        widget: string
      - label: Text of the section
        name: body
        widget: markdown
        buttons:
        - bold
        - italic
        - link
        - heading-three
        - bulleted-list
        - numbered-list
        editor_components: []
        modes:
        - rich_text
      summary: '{{fields.title}}'
      label_singular: section
      hint: Each section has a title and its text. The contents list beside the page is built from the titles. Use the Add button at the top right of the list to add a section.
  - name: accessibility
    label: Accessibility statement
    file: src/_data/text/accessibility.json
    fields:
    - label: Page title and search description
      name: meta
      widget: object
      collapsed: true
      fields:
      - label: Page title (browser tab and search results)
        name: title
        widget: string
      - label: Short description (search results)
        name: description
        widget: text
    - label: 'Section 1: Accessibility statement'
      name: s1
      widget: object
      collapsed: true
      fields:
      - label: 'Main heading: “Accessibility statement”'
        name: h1
        widget: text
        hint: Words in ==double equals signs== show in colour. A new line starts a new line on the page.
      - label: 'Paragraph: “How easy this website is to use, and w…”'
        name: p
        widget: string
      - label: 'Paragraph 2: “Last updated: date”'
        name: p2
        widget: string
    - label: Pink "draft" notice at the top
      name: draft
      required: false
      widget: markdown
      buttons:
      - bold
      - italic
      - link
      editor_components: []
      modes:
      - rich_text
      hint: 'Leave this box empty to remove the notice. '
    - label: Sections of the page
      name: sections
      widget: list
      fields:
      - label: Section title
        name: title
        widget: string
      - label: Text of the section
        name: body
        widget: markdown
        buttons:
        - bold
        - italic
        - link
        - heading-three
        - bulleted-list
        - numbered-list
        editor_components: []
        modes:
        - rich_text
      summary: '{{fields.title}}'
      label_singular: section
      hint: Each section has a title and its text. The contents list beside the page is built from the titles. Use the Add button at the top right of the list to add a section.
- name: news
  label: News stories
  label_singular: News story
  description: Each story gets its own page and appears on the News page. The newest story is shown first and largest.
  folder: src/news/items
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  identifier_field: title
  summary: '{{title}} · {{date_text}}'
  sortable_fields:
  - date
  - title
  fields:
  - label: Headline
    name: title
    widget: string
  - label: Date (used to put the stories in order)
    name: date
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
    picker_utc: true
  - label: Date as it should appear on the page
    name: date_text
    widget: string
    hint: 'For example: 14 October 2026'
  - label: Written by
    name: author
    widget: string
    required: false
  - label: Short summary
    name: summary
    widget: text
    hint: One or two sentences. Shown in the news list and in search results.
  - label: Main photo
    name: image
    widget: image
    choose_url: false
    hint: Use a photo under 1 MB if you can (the editing guide shows how to shrink one).
  - label: Describe the photo
    name: image_alt
    widget: string
    hint: One short sentence saying what is in the photo, for people who cannot see it.
  - label: The story
    name: body
    widget: markdown
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - quote
    - bulleted-list
    - numbered-list
    editor_components:
    - image
    modes:
    - rich_text
    hint: The first paragraph is shown larger, so make it the opening line. A quote is a paragraph that starts with >. Photos
      use the image button.
